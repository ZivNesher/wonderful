<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airport Investment - Agent</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a; color: #e2e8f0;
    display: flex; flex-direction: column; height: 100vh;
  }
  header { padding: 16px 20px; border-bottom: 1px solid #1e293b; position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  header h1 { font-size: 16px; margin: 0 0 4px; }
  header p { font-size: 12px; margin: 0; color: #94a3b8; }
  .header-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn-secondary { padding: 6px 12px; font-size: 12px; background: #1e293b; border: 1px solid #334155; color: #e2e8f0; border-radius: 6px; cursor: pointer; }
  .btn-secondary:hover { background: #334155; }
  #historyPanel {
    position: absolute; top: 100%; right: 20px; margin-top: 6px; width: 300px; max-height: 360px;
    overflow-y: auto; background: #1e293b; border: 1px solid #334155; border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35); z-index: 10;
  }
  .history-item { padding: 10px 14px; border-bottom: 1px solid #334155; cursor: pointer; }
  .history-item:last-child { border-bottom: none; }
  .history-item:hover { background: #334155; }
  .history-title { font-size: 13px; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-time { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .history-empty { padding: 14px; font-size: 12px; color: #94a3b8; text-align: center; }
  #log { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; line-height: 1.45; font-size: 14px; }
  .msg p { margin: 0 0 8px; }
  .msg p:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { margin: 4px 0 8px; padding-left: 20px; }
  .msg li { margin: 2px 0; }
  .msg code { background: rgba(148,163,184,0.2); border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .msg h1, .msg h2, .msg h3, .msg h4, .msg h5, .msg h6 { margin: 10px 0 6px; font-weight: 600; line-height: 1.3; }
  .msg h1:first-child, .msg h2:first-child, .msg h3:first-child { margin-top: 0; }
  .msg h1 { font-size: 17px; } .msg h2 { font-size: 16px; } .msg h3 { font-size: 15px; }
  .msg h4, .msg h5, .msg h6 { font-size: 14px; }
  .msg .table-wrap { overflow-x: auto; margin: 6px 0 10px; max-width: 100%; }
  .msg table { border-collapse: collapse; font-size: 13px; }
  .msg th, .msg td { border: 1px solid #334155; padding: 4px 9px; text-align: left; white-space: nowrap; }
  .msg th { background: rgba(148,163,184,0.15); }
  .web-badge { display: inline-block; font-size: 11px; color: #94a3b8; background: rgba(148,163,184,0.15); border-radius: 999px; padding: 2px 9px; margin-bottom: 8px; }
  .user { align-self: flex-end; background: #2563eb; color: white; white-space: pre-wrap; }
  .assistant { align-self: flex-start; background: #1e293b; }
  .system { align-self: center; color: #94a3b8; font-size: 12px; font-style: italic; }
  .thinking { align-self: flex-start; background: #1e293b; display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
  .thinking span { width: 6px; height: 6px; border-radius: 50%; background: #94a3b8; animation: pulse 1.2s infinite ease-in-out; }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
  form { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid #1e293b; }
  input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #f2f3f4; color: #000000; font-size: 14px; }
  button { padding: 10px 16px; border-radius: 8px; border: none; background: #2563eb; color: white; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Airport Investment Agent</h1>
  </div>
  <div class="header-actions">
    <button id="newBtn" class="btn-secondary" type="button" hidden>New</button>
    <button id="historyBtn" class="btn-secondary" type="button">History</button>
  </div>
  <div id="historyPanel" hidden></div>
</header>
<div id="log"></div>
<form id="form">
  <input id="input" type="text" placeholder="e.g. Which airports in New England are strong candidates for terminal expansion?" autocomplete="off">
  <button id="send" type="submit">Send</button>
</form>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const newBtn = document.getElementById("newBtn");
  const historyBtn = document.getElementById("historyBtn");
  const historyPanel = document.getElementById("historyPanel");
  let sessionId = null;

  // Escape first, THEN apply a small whitelist of markdown -> HTML transforms.
  // Every substitution below only ever introduces tags this code controls
  // (<strong>, <em>, <code>, <ul>/<li>, <p>, <br>) -- raw model text can never
  // become live HTML/script, because it's fully entity-escaped before any
  // markdown pattern is matched. This replaces the earlier textContent-only
  // rendering, which was safe but showed literal "**", "-", etc. to the user.
  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function splitTableRow(line) {
    // Strip one optional leading/trailing "|", then split on unescaped "|".
    const trimmed = line.trim().replace(/^\|/, "").replace(/\|$/, "");
    return trimmed.split("|").map((cell) => cell.trim());
  }

  const TABLE_SEPARATOR_RE = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;

  const inlineFormat = (s) =>
    s
      .replace(/`([^`]+?)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(?:^|(?<=\s))\*([^*\n]+?)\*(?=\s|$)/g, "<em>$1</em>");

  // Line-by-line, not whole-block: real model output routinely puts a header
  // directly above a list with only a single newline (no blank-line gap), so
  // classifying whole blank-line-delimited blocks missed that case -- this
  // walks lines with small amount of state (open list / open paragraph) instead.
  function renderMarkdownSafe(rawText) {
    const lines = escapeHtml(rawText).split("\n");
    let html = "";
    let paragraphLines = [];
    let listType = null; // "ul" | "ol" | null
    let listItems = [];

    const flushParagraph = () => {
      if (paragraphLines.length > 0) {
        html += `<p>${paragraphLines.map(inlineFormat).join("<br>")}</p>`;
        paragraphLines = [];
      }
    };
    const flushList = () => {
      if (listType) {
        html += `<${listType}>${listItems.join("")}</${listType}>`;
        listType = null;
        listItems = [];
      }
    };

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      if (line.trim() === "") {
        flushParagraph();
        flushList();
        continue;
      }

      const headerMatch = line.match(/^(#{1,6})\s+(.*)$/);
      if (headerMatch) {
        flushParagraph();
        flushList();
        const level = headerMatch[1].length;
        html += `<h${level}>${inlineFormat(headerMatch[2])}</h${level}>`;
        continue;
      }

      if (line.includes("|") && i + 1 < lines.length && TABLE_SEPARATOR_RE.test(lines[i + 1])) {
        flushParagraph();
        flushList();
        const headerCells = splitTableRow(line);
        let j = i + 2;
        const bodyRows = [];
        while (j < lines.length && lines[j].trim() !== "" && lines[j].includes("|")) {
          bodyRows.push(splitTableRow(lines[j]));
          j++;
        }
        const thead = `<tr>${headerCells.map((c) => `<th>${inlineFormat(c)}</th>`).join("")}</tr>`;
        const tbody = bodyRows.map((row) => `<tr>${row.map((c) => `<td>${inlineFormat(c)}</td>`).join("")}</tr>`).join("");
        html += `<div class="table-wrap"><table><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
        i = j - 1;
        continue;
      }

      const bulletMatch = line.match(/^\s*[-*]\s+(.*)$/);
      if (bulletMatch) {
        flushParagraph();
        if (listType !== "ul") flushList();
        listType = "ul";
        listItems.push(`<li>${inlineFormat(bulletMatch[1])}</li>`);
        continue;
      }

      const numberedMatch = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (numberedMatch) {
        flushParagraph();
        if (listType !== "ol") flushList();
        listType = "ol";
        listItems.push(`<li>${inlineFormat(numberedMatch[1])}</li>`);
        continue;
      }

      flushList();
      paragraphLines.push(line);
    }

    flushParagraph();
    flushList();
    return html;
  }

  function addMessage(text, role, usedWebSearch) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    if (role === "assistant") {
      let html = "";
      // Post-hoc, not live: the server tells us after the fact whether this
      // reply involved a web search (agent.py's used_web_search) -- there's
      // no mid-request signal to show it while waiting, since the search
      // itself runs server-side inside one non-streamed API call.
      if (usedWebSearch) {
        html += `<div class="web-badge">🔍 Included a web search</div>`;
      }
      html += renderMarkdownSafe(text);
      div.innerHTML = html;
    } else {
      div.textContent = text; // user text and system notices: no formatting needed
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function addThinkingIndicator() {
    const div = document.createElement("div");
    div.className = "msg thinking";
    div.innerHTML = "<span></span><span></span><span></span>";
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function timeAgo(unixSeconds) {
    const diffSec = Math.max(0, Date.now() / 1000 - unixSeconds);
    const units = [["day", 86400], ["hour", 3600], ["minute", 60]];
    for (const [name, secs] of units) {
      const n = Math.floor(diffSec / secs);
      if (n >= 1) return `${n} ${name}${n > 1 ? "s" : ""} ago`;
    }
    return "just now";
  }

  let hintEl = null; // the "Ask about..." placeholder -- tracked so it can be
  // removed the moment a session becomes active (first message sent, or a
  // saved conversation resumed), rather than lingering above real messages.

  function startNewConversation() {
    sessionId = null;
    log.innerHTML = "";
    hintEl = addMessage("Ask about US airport traffic, congestion, long-haul share, or expansion candidacy.", "system");
    historyPanel.hidden = true;
    newBtn.hidden = true; // no active session yet -- nothing to start fresh from
  }

  async function loadSession(id) {
    const res = await fetch(`/sessions/${id}`);
    if (!res.ok) return;
    const data = await res.json();
    sessionId = data.session_id;
    log.innerHTML = "";
    hintEl = null; // log was just cleared, so there's nothing left to remove
    for (const m of data.messages) {
      addMessage(m.text, m.role, m.used_web_search);
    }
    historyPanel.hidden = true;
    newBtn.hidden = false; // resuming counts as an active session
  }

  async function toggleHistoryPanel() {
    if (!historyPanel.hidden) {
      historyPanel.hidden = true;
      return;
    }
    historyPanel.innerHTML = `<div class="history-empty">Loading...</div>`;
    historyPanel.hidden = false;
    try {
      const res = await fetch("/sessions");
      const data = await res.json();
      if (!data.sessions.length) {
        historyPanel.innerHTML = `<div class="history-empty">No saved conversations yet.</div>`;
        return;
      }
      historyPanel.innerHTML = "";
      for (const s of data.sessions) {
        const item = document.createElement("div");
        item.className = "history-item";
        const title = document.createElement("div");
        title.className = "history-title";
        title.textContent = s.title;
        const time = document.createElement("div");
        time.className = "history-time";
        time.textContent = timeAgo(s.updated_at);
        item.appendChild(title);
        item.appendChild(time);
        item.addEventListener("click", () => loadSession(s.session_id));
        historyPanel.appendChild(item);
      }
    } catch (err) {
      historyPanel.innerHTML = `<div class="history-empty">Couldn't load history.</div>`;
    }
  }

  newBtn.addEventListener("click", startNewConversation);
  historyBtn.addEventListener("click", toggleHistoryPanel);
  document.addEventListener("click", (e) => {
    if (!historyPanel.hidden && !historyPanel.contains(e.target) && e.target !== historyBtn) {
      historyPanel.hidden = true;
    }
  });

  startNewConversation();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    if (hintEl) {
      hintEl.remove();
      hintEl = null;
    }
    newBtn.hidden = false; // sending a message starts an active session
    addMessage(message, "user");
    input.value = "";
    sendBtn.disabled = true;
    const thinkingEl = addThinkingIndicator();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, session_id: sessionId }),
      });
      const data = await res.json();
      thinkingEl.remove();
      if (!res.ok) {
        addMessage("Error: " + (data.error || "request failed"), "system");
      } else {
        sessionId = data.session_id;
        addMessage(data.reply, "assistant", data.used_web_search);
      }
    } catch (err) {
      thinkingEl.remove();
      addMessage("Network error: " + err.message, "system");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
