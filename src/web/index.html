<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airport Investment - Agent</title>
<style>
  :root {
    color-scheme: dark;
    /* ChatGPT-style neutral dark palette */
    --bg: #212121;
    --bg-sidebar: #171717;
    --surface: #2f2f2f;
    --border: #4d4d4f;
    --text: #ececec;
    --text-faint: #8e8ea0;
    --accent: #ececec;
    --accent-text: #212121;
  }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; height: 100vh; overflow: hidden;
  }
  #sidebar {
    width: 260px; flex-shrink: 0; background: var(--bg-sidebar); border-right: 1px solid var(--surface);
    display: flex; flex-direction: column; padding: 12px;
  }
  .sidebar-brand { font-size: 13px; font-weight: 600; color: var(--text); padding: 8px 6px 14px; }
  .new-chat-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 12px;
    border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text);
    font-size: 13px; cursor: pointer; text-align: left;
  }
  .new-chat-btn:hover { background: var(--surface); }
  #historyList { flex: 1; overflow-y: auto; margin-top: 14px; display: flex; flex-direction: column; gap: 2px; }
  .history-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .history-item:hover { background: var(--surface); }
  .history-item.active { background: var(--surface); }
  .history-title { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-time { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .history-empty { padding: 10px; font-size: 12px; color: var(--text-faint); }
  #chatArea { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .btn-voice { padding: 10px 14px; border-radius: 8px; border: none; background: var(--surface); color: var(--text); font-size: 16px; cursor: pointer; line-height: 1; }
  .btn-voice:hover { background: var(--border); }
  .btn-voice-listening { background: #dc2626; animation: recordPulse 1.4s infinite; }
  .btn-voice-thinking { background: #d97706; }
  .btn-voice-speaking { background: #2563eb; }
  @keyframes recordPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.55); } 50% { box-shadow: 0 0 0 7px rgba(220,38,38,0); } }
  #log { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; line-height: 1.45; font-size: 14px; }
  .msg p { margin: 0 0 8px; }
  .msg p:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { margin: 4px 0 8px; padding-left: 20px; }
  .msg li { margin: 2px 0; }
  .msg code { background: rgba(255,255,255,0.1); border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .msg h1, .msg h2, .msg h3, .msg h4, .msg h5, .msg h6 { margin: 10px 0 6px; font-weight: 600; line-height: 1.3; }
  .msg h1:first-child, .msg h2:first-child, .msg h3:first-child { margin-top: 0; }
  .msg h1 { font-size: 17px; } .msg h2 { font-size: 16px; } .msg h3 { font-size: 15px; }
  .msg h4, .msg h5, .msg h6 { font-size: 14px; }
  .msg .table-wrap { overflow-x: auto; margin: 6px 0 10px; max-width: 100%; }
  .msg table { border-collapse: collapse; font-size: 13px; }
  .msg th, .msg td { border: 1px solid var(--border); padding: 4px 9px; text-align: left; white-space: nowrap; }
  .msg th { background: rgba(255,255,255,0.08); }
  .web-badge { display: inline-block; font-size: 11px; color: var(--text-faint); background: rgba(255,255,255,0.08); border-radius: 999px; padding: 2px 9px; margin-bottom: 8px; }
  .user { align-self: flex-end; background: var(--surface); color: var(--text); white-space: pre-wrap; }
  .assistant { align-self: flex-start; background: var(--surface); }
  .system { align-self: center; color: var(--text-faint); font-size: 12px; font-style: italic; }
  .thinking { align-self: flex-start; background: var(--surface); display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
  .thinking span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); animation: pulse 1.2s infinite ease-in-out; }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
  form { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--surface); }
  input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; }
  input::placeholder { color: var(--text-faint); }
  input:focus { outline: 1px solid var(--text-faint); }
  button { padding: 10px 16px; border-radius: 8px; border: none; background: var(--accent); color: var(--accent-text); font-size: 14px; font-weight: 600; cursor: pointer; }
  #send:hover:not(:disabled) { background: #d9d9d9; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<aside id="sidebar">
  <div class="sidebar-brand">Airport Investment Agent</div>
  <button id="newBtn" class="new-chat-btn" type="button">&plus; New chat</button>
  <div id="historyList"></div>
</aside>
<main id="chatArea">
  <div id="log"></div>
  <form id="form">
    <input id="input" type="text" placeholder="e.g. Which airports in New England are strong candidates for terminal expansion?" autocomplete="off">
    <button id="send" type="submit">Send</button>
    <button id="callBtn" class="btn-voice" type="button" title="Start voice call">📞</button>
  </form>
</main>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const newBtn = document.getElementById("newBtn");
  const historyList = document.getElementById("historyList");
  let sessionId = null;
  let conversationId = 0; // bumped whenever the visible conversation changes, to discard stale /chat replies

  // Escape first, then apply a small whitelist of markdown -> HTML transforms,
  // so raw model text can never become live HTML/script.
  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function splitTableRow(line) {
    const trimmed = line.trim().replace(/^\|/, "").replace(/\|$/, "");
    return trimmed.split("|").map((cell) => cell.trim());
  }

  const TABLE_SEPARATOR_RE = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;

  const inlineFormat = (s) =>
    s
      .replace(/`([^`]+?)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(?:^|(?<=\s))\*([^*\n]+?)\*(?=\s|$)/g, "<em>$1</em>");

  function renderMarkdownSafe(rawText) {
    const lines = escapeHtml(rawText).split("\n");
    let html = "";
    let paragraphLines = [];
    let listType = null; // "ul" | "ol" | null
    let listItems = [];

    const flushParagraph = () => {
      if (paragraphLines.length > 0) {
        html += `<p>${paragraphLines.map(inlineFormat).join("<br>")}</p>`;
        paragraphLines = [];
      }
    };
    const flushList = () => {
      if (listType) {
        html += `<${listType}>${listItems.join("")}</${listType}>`;
        listType = null;
        listItems = [];
      }
    };

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      if (line.trim() === "") {
        flushParagraph();
        flushList();
        continue;
      }

      const headerMatch = line.match(/^(#{1,6})\s+(.*)$/);
      if (headerMatch) {
        flushParagraph();
        flushList();
        const level = headerMatch[1].length;
        html += `<h${level}>${inlineFormat(headerMatch[2])}</h${level}>`;
        continue;
      }

      if (line.includes("|") && i + 1 < lines.length && TABLE_SEPARATOR_RE.test(lines[i + 1])) {
        flushParagraph();
        flushList();
        const headerCells = splitTableRow(line);
        let j = i + 2;
        const bodyRows = [];
        while (j < lines.length && lines[j].trim() !== "" && lines[j].includes("|")) {
          bodyRows.push(splitTableRow(lines[j]));
          j++;
        }
        const thead = `<tr>${headerCells.map((c) => `<th>${inlineFormat(c)}</th>`).join("")}</tr>`;
        const tbody = bodyRows.map((row) => `<tr>${row.map((c) => `<td>${inlineFormat(c)}</td>`).join("")}</tr>`).join("");
        html += `<div class="table-wrap"><table><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
        i = j - 1;
        continue;
      }

      const bulletMatch = line.match(/^\s*[-*]\s+(.*)$/);
      if (bulletMatch) {
        flushParagraph();
        if (listType !== "ul") flushList();
        listType = "ul";
        listItems.push(`<li>${inlineFormat(bulletMatch[1])}</li>`);
        continue;
      }

      const numberedMatch = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (numberedMatch) {
        flushParagraph();
        if (listType !== "ol") flushList();
        listType = "ol";
        listItems.push(`<li>${inlineFormat(numberedMatch[1])}</li>`);
        continue;
      }

      flushList();
      paragraphLines.push(line);
    }

    flushParagraph();
    flushList();
    return html;
  }

  function addMessage(text, role, usedWebSearch) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    if (role === "assistant") {
      let html = "";
      if (usedWebSearch) {
        html += `<div class="web-badge">🔍 Included a web search</div>`;
      }
      html += renderMarkdownSafe(text);
      div.innerHTML = html;
    } else {
      div.textContent = text; // user text and system notices: no formatting needed
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function addThinkingIndicator() {
    const div = document.createElement("div");
    div.className = "msg thinking";
    div.innerHTML = "<span></span><span></span><span></span>";
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function timeAgo(unixSeconds) {
    const diffSec = Math.max(0, Date.now() / 1000 - unixSeconds);
    const units = [["day", 86400], ["hour", 3600], ["minute", 60]];
    for (const [name, secs] of units) {
      const n = Math.floor(diffSec / secs);
      if (n >= 1) return `${n} ${name}${n > 1 ? "s" : ""} ago`;
    }
    return "just now";
  }

  let hintEl = null; // the "Ask about..." placeholder, removed once a session becomes active

  function startNewConversation() {
    conversationId++;
    sessionId = null;
    log.innerHTML = "";
    hintEl = addMessage("Ask about US airport traffic, congestion, long-haul share, or expansion candidacy.", "system");
    refreshHistoryList();
  }

  async function loadSession(id) {
    const res = await fetch(`/sessions/${id}`);
    if (!res.ok) return;
    const data = await res.json();
    conversationId++;
    sessionId = data.session_id;
    log.innerHTML = "";
    hintEl = null;
    for (const m of data.messages) {
      addMessage(m.text, m.role, m.used_web_search);
    }
    refreshHistoryList();
  }

  async function refreshHistoryList() {
    try {
      const res = await fetch("/sessions");
      const data = await res.json();
      historyList.innerHTML = "";
      if (!data.sessions.length) {
        historyList.innerHTML = `<div class="history-empty">No saved conversations yet.</div>`;
        return;
      }
      for (const s of data.sessions) {
        const item = document.createElement("div");
        item.className = "history-item" + (s.session_id === sessionId ? " active" : "");
        const title = document.createElement("div");
        title.className = "history-title";
        title.textContent = s.title;
        const time = document.createElement("div");
        time.className = "history-time";
        time.textContent = timeAgo(s.updated_at);
        item.appendChild(title);
        item.appendChild(time);
        item.addEventListener("click", () => loadSession(s.session_id));
        historyList.appendChild(item);
      }
    } catch (err) {
      historyList.innerHTML = `<div class="history-empty">Couldn't load history.</div>`;
    }
  }

  newBtn.addEventListener("click", startNewConversation);
  startNewConversation();

  // Shared by the typed form and voice mode.
  async function sendMessage(message) {
    if (hintEl) {
      hintEl.remove();
      hintEl = null;
    }
    addMessage(message, "user");
    sendBtn.disabled = true;
    const thinkingEl = addThinkingIndicator();
    const myConversationId = conversationId; // detect New chat / session switch while this request is in flight

    let replyText = null;
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, session_id: sessionId }),
      });
      const data = await res.json();
      const isStillActive = myConversationId === conversationId;
      if (isStillActive) thinkingEl.remove();

      if (!res.ok) {
        if (isStillActive) addMessage("Error: " + (data.error || "request failed"), "system");
      } else {
        if (isStillActive) {
          sessionId = data.session_id;
          addMessage(data.reply, "assistant", data.used_web_search);
          replyText = data.reply;
        }
        refreshHistoryList(); // keep sidebar timestamps fresh even if the user moved on
      }
    } catch (err) {
      if (myConversationId === conversationId) {
        thinkingEl.remove();
        addMessage("Network error: " + err.message, "system");
      }
    } finally {
      sendBtn.disabled = false;
    }
    return replyText;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    await sendMessage(message);
    input.focus();
  });

  // ---- Real-time voice call (ElevenLabs Conversational AI) ----
  // The only voice mode: a continuous, live call where ElevenLabs handles mic
  // capture/audio playback/turn-taking itself over WebRTC. Our server is only
  // ever called by ElevenLabs in the background (as the "Custom LLM"), never
  // directly by this code.

  const callBtn = document.getElementById("callBtn");
  let activeCall = null; // the ElevenLabs Conversation instance, or null when not on a call

  function setCallButtonState(state) {
    // state: "idle" | "connecting" | "listening" | "speaking"
    const icons = { idle: "📞", connecting: "⏳", listening: "🔴", speaking: "🔊" };
    callBtn.textContent = icons[state];
    callBtn.title = state === "idle" ? "Start voice call" : "Click to end call";
    callBtn.classList.remove("btn-voice-listening", "btn-voice-thinking", "btn-voice-speaking");
    if (state === "connecting") callBtn.classList.add("btn-voice-thinking");
    if (state === "listening") callBtn.classList.add("btn-voice-listening");
    if (state === "speaking") callBtn.classList.add("btn-voice-speaking");
  }

  async function endVoiceCall(alreadyDisconnected) {
    if (!activeCall) return;
    const call = activeCall;
    activeCall = null;
    if (!alreadyDisconnected) {
      try { await call.endSession(); } catch (err) {}
    }
    addMessage("Voice call ended.", "system");
    setCallButtonState("idle");
  }

  async function startVoiceCall() {
    setCallButtonState("connecting");
    try {
      const res = await fetch("/voice-call/signed-url");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "failed to start call");

      const { Conversation } = await import("https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm");
      activeCall = await Conversation.startSession({
        signedUrl: data.signed_url,
        connectionType: "websocket", // signedUrl (our /get-signed-url call) pairs with websocket; webrtc needs a conversationToken instead
        onStatusChange: ({ status }) => {
          if (status === "disconnected") endVoiceCall(true);
        },
        onModeChange: ({ mode }) => {
          if (activeCall) setCallButtonState(mode === "speaking" ? "speaking" : "listening");
        },
        onMessage: ({ message, role }) => {
          addMessage(message, role === "agent" ? "assistant" : "user");
        },
        onError: (message) => {
          addMessage("Voice call error: " + message, "system");
          endVoiceCall(true);
        },
      });
      addMessage("Voice call connected — speak naturally; click the phone button to hang up.", "system");
    } catch (err) {
      addMessage("Couldn't start voice call: " + err.message, "system");
      activeCall = null;
      setCallButtonState("idle");
    }
  }

  callBtn.addEventListener("click", () => {
    if (activeCall) {
      endVoiceCall(false);
    } else {
      startVoiceCall();
    }
  });
</script>
</body>
</html>
